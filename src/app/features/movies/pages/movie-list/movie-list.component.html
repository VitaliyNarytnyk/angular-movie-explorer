<section class="mt-8" [attr.aria-busy]="movieService.loading()">
  <h2
    #pageHeading
    tabindex="-1"
    class="mb-4 text-2xl font-semibold focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-teal-400"
  >
    Movies
  </h2>

  <app-movie-search (searchRequested)="movieService.searchMovies($event)" />

  @if (movieService.loading()) {
    <p role="status">Loading movies...</p>
  } @else if (movieService.error(); as error) {
    <p role="alert">{{ error }}</p>
  } @else {
    <ul class="grid gap-6 sm:grid-cols-2 lg:grid-cols-4">
      @for (movie of movieService.movies(); track movie.id) {
        <li>
          <app-movie-card [movie]="movie" [priority]="$index < 4" />
        </li>
      } @empty {
        <li>No movies found.</li>
      }
    </ul>
  }
</section>
