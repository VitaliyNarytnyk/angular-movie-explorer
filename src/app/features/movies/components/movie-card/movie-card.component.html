<a
  [routerLink]="['/movies', movie().id]"
  queryParamsHandling="preserve"
  class="movie-card"
>
  @if (posterUrl(); as poster) {
    @if (priority()) {
      <img
        [ngSrc]="poster"
        priority
        width="500"
        height="750"
        alt=""
        class="movie-poster"
      />
    } @else {
      <img
        [ngSrc]="poster"
        width="500"
        height="750"
        alt=""
        class="movie-poster"
      />
    }
  } @else {
    <div
      class="mb-4 flex aspect-2/3 items-center justify-center rounded-lg bg-surface-raised text-sm text-muted"
    >
      No poster available
    </div>
  }

  <h3 class="text-lg font-semibold">{{ movie().title }}</h3>

  <p class="mt-2 line-clamp-3 text-sm text-muted">
    {{ movie().overview || 'No description available.' }}
  </p>
</a>
